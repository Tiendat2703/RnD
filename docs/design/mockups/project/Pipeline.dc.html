<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hàng sáu bước pipeline — thành phần stage, sáng và tối</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Overpass:wght@600;700;800&amp;family=Overpass+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
</style>
</helmet>
<div style="position: relative; width: 1120px; height: 440px; box-sizing: border-box; background: #EEF1F4; color: #14181D; font-family: &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">

  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: baseline; gap: 12px">
    <span style="font-family: Overpass, sans-serif; font-size: 15px; font-weight: 700; line-height: 20px; letter-spacing: -0.01em">Hàng sáu bước — một dòng ngang, nhãn chỉ ở bước đang chạy</span>
    <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 11px; color: #58636F">.stages / .stage — 26px · min-width 26 · pad 0 8 (đang chạy 0 10) · gap 6 · bo 9999</span>
  </div>

  <sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
    <div style="position: absolute; top: 56px; left: {{b.x}}; width: 540px; box-sizing: border-box; padding: 16px; border-radius: 16px; border: 1px solid {{b.bd}}; background: {{b.bg}}">
      <div style="font-family: Overpass, sans-serif; font-size: 11px; font-weight: 700; line-height: 15px; letter-spacing: 0.05em; color: {{b.headFg}}">{{b.name}}</div>
      <sc-for list="{{b.rows}}" as="r" hint-placeholder-count="4">
        <div style="margin-top: 14px">
          <div style="font-size: 11px; line-height: 15px; color: {{b.capFg}}">{{r.caption}}</div>
          <div style="margin-top: 5px; display: flex; align-items: center; gap: 6px; width: max-content" role="list" aria-label="Các bước xử lý">
            <sc-for list="{{r.stages}}" as="s" hint-placeholder-count="6">
              <span role="listitem" title="{{s.title}}" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: {{s.pad}}; border-radius: 9999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font-family: Overpass, sans-serif; font-size: 11px; font-weight: 700; line-height: 1; letter-spacing: 0.05em; white-space: nowrap">{{s.text}}</span>
            </sc-for>
          </div>
          <sc-if value="{{r.hasBox}}" hint-placeholder-val="{{false}}">
            <div style="margin-top: 6px; width: 336px; height: 26px; box-sizing: border-box; border: 1px dashed {{b.bd}}; border-radius: 9999px"></div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>

  <div style="position: absolute; left: 16px; top: 372px; right: 16px; display: flex; gap: 10px">
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
      <div style="flex: 1 1 0; min-width: 0; display: flex; gap: 8px; padding: 8px 10px; box-sizing: border-box; border: 1px solid #DCE2E8; border-radius: 12px; background: #FFFFFF">
        <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 11px; color: #0E7C86; flex: none">{{n.i}}</span>
        <span style="font-size: 12px; line-height: 17px; color: #58636F">{{n.text}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Đang lắng nghe', 'Đang phiên âm', 'Đang tách chủ đề', 'Đang tìm nguồn', 'Đang viết lý do', 'Đang gửi vào chat'];
    const row = (active, theme) => labels.map((label, i) => {
      const state = i === active ? 'active' : (active >= 0 && i < active) ? 'done' : 'pending';
      const t = theme[state];
      return {
        text: state === 'active' ? (i + 1) + ' ' + label : String(i + 1),
        title: label,
        pad: state === 'active' ? '0 10px' : '0 8px',
        bg: t.bg, fg: t.fg, bd: t.bd
      };
    });
    const light = {
      pending: { bg: '#FFFFFF', fg: '#58636F', bd: '#DCE2E8' },
      done: { bg: '#E1EFF1', fg: '#14181D', bd: 'transparent' },
      active: { bg: '#0E7C86', fg: '#FFFFFF', bd: 'transparent' }
    };
    const dark = {
      pending: { bg: '#161C22', fg: '#A0B1C0', bd: '#232B34' },
      done: { bg: '#20393C', fg: '#E6EAF0', bd: 'transparent' },
      active: { bg: '#3FA3AE', fg: '#0A2629', bd: 'transparent' }
    };
    const mk = (theme) => ([
      { caption: 'Không chạy — active null: cả sáu bước đều chưa tới', stages: row(-1, theme), hasBox: false },
      { caption: 'Bước 2 đang chạy', stages: row(1, theme), hasBox: false },
      { caption: 'Bước 5 — nhãn dài nhất trong sáu nhãn', stages: row(4, theme), hasBox: false },
      { caption: 'Bước 6 — vạch đứt = cột 336px của popup và panel', stages: row(5, theme), hasBox: true }
    ]);
    return {
      blocks: [
        { x: '16px', name: 'Theme sáng — popup theo hệ thống', bg: '#FFFFFF', bd: '#DCE2E8', headFg: '#58636F', capFg: '#58636F', rows: mk(light) },
        { x: '564px', name: 'Theme tối — popup ban đêm và panel trong Meet (luôn tối)', bg: '#161C22', bd: '#232B34', headFg: '#A0B1C0', capFg: '#A0B1C0', rows: mk(dark) }
      ],
      notes: [
        { i: '01', text: 'Petrol chỉ tô bước đang chạy. Đã qua = nền tint, chưa tới = vòng viền. Hàng này là lý do duy nhất màu thương hiệu xuất hiện ở đây.' },
        { i: '02', text: 'Bỏ nhãn ở bước không chạy là có ý: trong cột 360px, sáu nhãn đầy đủ không đọc được mà phải cuộn dọc.' },
        { i: '03', text: 'Nhãn đầy đủ vẫn tới được: title (hover) cho bước không chạy, aria-current="step" cho bước đang chạy. .panel__stages để overflow-x: auto cho nhãn dài hơn.' }
      ]
    };
  }
}
</script>
</body>
</html>
