<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MeetMate popup — thiếu khóa (dải lỗi)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Overpass:wght@600;700;800&amp;family=Overpass+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
a { color: #14417F; } a:hover { color: #0A2B54; }
input:focus-visible, button:focus-visible { outline: 2px solid #0E7C86; outline-offset: 2px; }
</style>
</helmet>
<div style="width: 360px; height: 520px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; color: #14181D; font: 400 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 9999px; background: #0E7C86; color: #FFFFFF; font: 800 13px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: -0.025em">MeetMate</span>
    <span style="display: inline-flex; align-items: center; height: 24px; padding: 3px 9px; border-radius: 9999px; background: #F6F8FA; color: #58636F; border: 1px solid #DCE2E8; font: 700 11px/15px &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em; white-space: nowrap">Chưa nghe</span>
  </header>

  <div role="list" aria-label="Các bước xử lý" style="display: flex; align-items: center; gap: 6px">
    <span role="listitem" title="Đang lắng nghe" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">1</span>
    <span role="listitem" title="Đang phiên âm" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">2</span>
    <span role="listitem" title="Đang tách chủ đề" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">3</span>
    <span role="listitem" title="Đang tìm nguồn" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">4</span>
    <span role="listitem" title="Đang viết lý do" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">5</span>
    <span role="listitem" title="Đang gửi vào chat" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">6</span>
  </div>

  <div style="display: grid; gap: 12px">
    <div style="display: grid; gap: 4px">
      <label for="blaze">Khóa Blaze</label>
      <input id="blaze" type="password" value="blaze-sk-demo-0123456789" autocomplete="off" spellcheck="false" style="width: 100%; height: 40px; box-sizing: border-box; padding: 9px 12px; border: 1px solid #7E8B99; border-radius: 16px; background: #FFFFFF; color: #14181D; font: 400 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">
    </div>
    <div style="display: grid; gap: 4px">
      <label for="exa">Khóa Exa</label>
      <input id="exa" type="password" value="" placeholder="dán khóa Exa vào đây" autocomplete="off" spellcheck="false" style="width: 100%; height: 40px; box-sizing: border-box; padding: 9px 12px; border: 1px solid #7E8B99; border-radius: 16px; background: #FFFFFF; color: #14181D; font: 400 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">
    </div>
  </div>

  <label style="display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid #DCE2E8; border-radius: 16px; background: #F6F8FA; cursor: pointer">
    <input type="checkbox" style="margin: 3px 0 0; width: 16px; height: 16px; accent-color: #14181D; flex: none">
    <span>
      <b style="display: block; font-weight: 600">Chế độ thử</b>
      <span style="font: 400 12px/16px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif; color: #58636F">Dữ liệu giả, không cần khóa. Không ghi âm và không gõ gì vào chat Meet.</span>
    </span>
  </label>

  <div role="status" aria-live="polite" style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 12px; background: #A62B22; color: #FFFFFF; font: 400 12px/16px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block; margin-top: 1px"><path d="M8.5 3.5h7l5 5v7l-5 5h-7l-5-5v-7z"></path><path d="M12 8v5M12 15.8v.1"></path></svg>
    <span>Thiếu khóa Blaze hoặc Exa</span>
  </div>

  <div style="flex: 1 1 auto"></div>

  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; box-sizing: border-box; padding: 10px 18px; border: 0; border-radius: 24px; background: #0E7C86; color: #FFFFFF; font: 600 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif; cursor: pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><path d="M8 5.5v13l10-6.5z"></path></svg>
    Bắt đầu nghe
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
