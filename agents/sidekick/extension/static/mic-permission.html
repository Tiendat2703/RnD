<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Quyền micro — MeetMate</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--ground); display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .sheet { width: min(420px, 100%); display: grid; gap: 16px; padding: 24px; border: 1px solid var(--hairline); border-radius: 32px; background: var(--canvas); }
  .sheet h1 { margin: 0; font: 600 22px/28px var(--font-display); letter-spacing: -0.025em; }
  .sheet p { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="mm">
<main class="sheet">
  <span class="wordmark" style="justify-self: start">MeetMate</span>
  <h1>Cho phép MeetMate dùng micro</h1>
  <p>MeetMate nghe hai kênh: âm thanh của tab Meet và micro của bạn. Khi Chrome hỏi, hãy chọn Cho phép. Trang này tự đóng khi xong.</p>
  <div id="result" role="status" aria-live="polite"></div>
</main>
<script src="mic-permission.js"></script>
</body>
</html>
