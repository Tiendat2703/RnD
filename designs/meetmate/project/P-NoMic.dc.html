<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MeetMate popup — đang chạy nhưng suy giảm (dải vàng)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Overpass:wght@600;700;800&amp;family=Overpass+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
a { color: #14417F; } a:hover { color: #0A2B54; }
</style>
</helmet>
<div style="width: 360px; height: 520px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; color: #14181D; font: 400 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between">
    <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 9999px; background: #0E7C86; color: #FFFFFF; font: 800 13px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: -0.025em">MeetMate</span>
    <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 3px 9px; border-radius: 9999px; background: #0E7C86; color: #FFFFFF; font: 700 11px/15px &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em; white-space: nowrap">
      <span style="width: 6px; height: 6px; border-radius: 9999px; background: #FFFFFF; display: block" aria-hidden="true"></span>
      Đang nghe
    </span>
  </header>

  <section style="display: grid; padding: 12px; border: 1px solid #DCE2E8; border-radius: 16px; background: #F6F8FA">
    <span style="font: 700 11px/15px &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em; color: #58636F">Phiên từ web console</span>
    <p style="margin: 2px 0 0; font: 600 16px/24px &quot;Overpass&quot;, sans-serif; color: #14181D">Họp nhóm Sản phẩm — chốt giá gói SME</p>
  </section>

  <div role="list" aria-label="Các bước xử lý" style="display: flex; align-items: center; gap: 6px">
    <span role="listitem" title="Đang lắng nghe" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid transparent; background: #E1EFF1; color: #14181D; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">1</span>
    <span role="listitem" aria-current="step" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 9999px; border: 1px solid transparent; background: #0E7C86; color: #FFFFFF; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em; white-space: nowrap">2 Đang phiên âm</span>
    <span role="listitem" title="Đang tách chủ đề" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">3</span>
    <span role="listitem" title="Đang tìm nguồn" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">4</span>
    <span role="listitem" title="Đang viết lý do" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">5</span>
    <span role="listitem" title="Đang gửi vào chat" style="display: inline-flex; align-items: center; justify-content: center; height: 26px; min-width: 26px; padding: 0 8px; border-radius: 9999px; border: 1px solid #DCE2E8; background: #FFFFFF; color: #58636F; font: 700 11px/1 &quot;Overpass&quot;, sans-serif; letter-spacing: 0.05em">6</span>
  </div>

  <div role="status" aria-live="polite" style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 12px; background: #FFF3DB; color: #6E4A00; font: 400 12px/16px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E4A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block; margin-top: 1px"><path d="M12 4 3.5 19h17z"></path><path d="M12 10v4M12 16.6v.1"></path></svg>
    <span>Không dùng được micro — chỉ nghe âm thanh từ người khác</span>
  </div>

  <div style="flex: 1 1 auto"></div>

  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 40px; box-sizing: border-box; padding: 10px 18px; border: 0; border-radius: 24px; background: #0E7C86; color: #FFFFFF; font: 600 14px/20px &quot;Be Vietnam Pro&quot;, system-ui, sans-serif; cursor: pointer">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; display: block"><rect x="6.5" y="6.5" width="11" height="11" rx="2"></rect></svg>
    Dừng nghe
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
