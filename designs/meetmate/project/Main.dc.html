<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MeetMate popup — đang chạy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Overpass:wght@600;700;800&amp;family=Overpass+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
a { color: #14417F; } a:hover { color: #0E2E5C; }
</style>
</helmet>
<div style="width: 360px; height: 520px; box-sizing: border-box; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 16px; background: {{ground}}; color: #14181D; font-family: &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">

  <div style="display: flex; align-items: baseline; gap: 8px">
    <span style="font-family: Overpass, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; color: {{provenance}}">MeetMate</span>
    <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 10px; color: #58636F; letter-spacing: 0.04em">0.1.0</span>
    <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: {{provenance}}; color: #FFFFFF; font-size: 11px; font-weight: 600">
      <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true" style="display: block"><circle cx="4.5" cy="4.5" r="4.5" fill="#FFFFFF"></circle></svg>
      Đang chạy
    </span>
  </div>

  <div style="display: flex; align-items: center; gap: 7px; padding: 8px 10px; border: 1px solid #DCE2E8; border-radius: 10px; background: #FFFFFF">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#58636F" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex: none; display: block">
      <rect x="2.5" y="5" width="19" height="12.5" rx="2.5"></rect><path d="M8.5 20.5h7"></path>
    </svg>
    <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 11px; color: #58636F; overflow-wrap: anywhere">meet.google.com/klm-cdef-rsw</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: 10px">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: #58636F">Đã nghe</span>
      <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 28px; font-weight: 500; line-height: 32px; color: #14181D">03:41</span>
    </div>
    <div style="display: flex; flex-direction: column; margin-left: auto; text-align: right">
      <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: #58636F">Tin vào chat</span>
      <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 28px; font-weight: 500; line-height: 32px; color: #14181D">4</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{stages}}" as="st" hint-placeholder-count="6">
        <div style="height: 5px; border-radius: 3px; background: {{st.color}}" title="{{st.name}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{provenance}}" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; display: block">
        <circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path>
      </svg>
      <span style="font-size: 12px; font-weight: 500; color: #58636F">Đang tìm nguồn cho chủ đề này</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 13px; border: 1px solid #DCE2E8; border-radius: 12px; background: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="width: 6px; height: 6px; border-radius: 2px; background: {{provenance}}; flex: none" aria-hidden="true"></span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #0A5F67">Chủ đề đang bàn</span>
    </div>
    <div style="font-family: Overpass, sans-serif; font-size: 15px; font-weight: 700; line-height: 20px; letter-spacing: -0.01em; color: #14181D">Bảng giá gói SME Việt Nam</div>
    <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 2px">
      <sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; gap: 7px; align-items: baseline">
          <span style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 10px; color: #58636F; flex: none">{{s.idx}}</span>
          <span style="font-size: 12px; line-height: 16px; color: #14181D; overflow-wrap: anywhere">{{s.title}}</span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; padding-top: 9px; border-top: 1px solid #EEF1F4; font-size: 10.5px; line-height: 14px; color: #58636F">Mọi đường dẫn nằm trong kết quả tìm nguồn · tin gửi tối đa 450 ký tự</div>
  </div>

  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 42px; box-sizing: border-box; border: 1.5px solid #14181D; border-radius: 12px; background: #14181D; color: #FFFFFF; font-family: Overpass, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; cursor: pointer">
    <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><rect x="4" y="4" width="16" height="16" rx="3" fill="#FFFFFF"></rect></svg>
    Dừng
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"provenance":{"editor":"color","default":"#0E7C86"},"ground":{"editor":"color","default":"#EEF1F4"},"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const done = '#0E7C86', active = '#6FB6BD', pending = '#DCE2E8';
    const order = [done, done, done, active, pending, pending];
    const keys = ['Nghe', 'Phiên âm', 'Chủ đề', 'Tìm nguồn', 'Viết lý do', 'Gửi chat'];
    return {
      provenance: this.props.provenance ?? '#0E7C86',
      ground: this.props.ground ?? '#EEF1F4',
      stages: keys.map((name, i) => ({ name, color: order[i] })),
      sources: [
        { idx: '1/4', title: 'Bảng giá — Base.vn' },
        { idx: '2/4', title: 'Bảng giá — Misa amis' },
        { idx: '3/4', title: 'Gói AMIS cho doanh nghiệp nhỏ' }
      ]
    };
  }
}
</script>
</body>
</html>
