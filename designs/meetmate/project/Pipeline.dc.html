<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Dải sáu giai đoạn — spec năm trạng thái</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Overpass:wght@600;700;800&amp;family=Overpass+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; }
a { color: #14417F; } a:hover { color: #0E2E5C; }
</style>
</helmet>
<div style="width: 1120px; height: 200px; box-sizing: border-box; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; color: #14181D; font-family: &quot;Be Vietnam Pro&quot;, system-ui, sans-serif">

  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: Overpass, sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #0A5F67">DẢI GIAI ĐOẠN</span>
    <span style="font-size: 11px; color: #58636F">sáu bước của pipeline · một màu petrol, phân biệt bằng độ sáng · tên đầy đủ chỉ hiện khi đang chạy</span>
    <span style="margin-left: auto; font-family: &quot;Overpass Mono&quot;, monospace; font-size: 10px; color: #58636F">PipelineStage × 5</span>
  </div>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
    <div style="display: flex; align-items: center; gap: 12px; height: 24px">
      <span style="flex: none; width: 210px; font-size: 11.5px; color: #14181D"><b style="font-family: &quot;Overpass Mono&quot;, monospace; font-size: 10.5px; color: {{r.labelFg}}">{{r.state}}</b> &nbsp;{{r.vi}}</span>
      <div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px">
        <sc-for list="{{r.segs}}" as="s" hint-placeholder-count="6">
          <div style="height: 6px; border-radius: 3px; background: {{s.bg}}; border: 1px solid {{s.bd}}; box-sizing: border-box"></div>
        </sc-for>
      </div>
      <span style="flex: none; width: 300px; display: flex; align-items: center; gap: 6px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{r.glyphFg}}" stroke-width="2.1" stroke-linecap="round" aria-hidden="true" style="flex: none; display: block">
          <path d="{{r.glyph}}"></path>
        </svg>
        <span style="font-size: 11.5px; line-height: 15px; color: {{r.captionFg}}">{{r.caption}}</span>
      </span>
    </div>
  </sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E7C86"},"$preview":{"width":1120,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0E7C86';
    const none = 'transparent';
    return {
      accent,
      rows: [
        { state: 'pending', vi: 'chưa tới', labelFg: '#58636F', captionFg: '#58636F',
          segs: [{ bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }],
          caption: 'không chữ — chỉ là đường chờ', glyph: 'M12 7v10M7 12h10', glyphFg: '#7E8B99' },
        { state: 'active', vi: 'đang chạy', labelFg: accent, captionFg: '#14181D',
          segs: [{ bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: accent, bd: accent }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }],
          caption: 'Đang tìm nguồn cho chủ đề này', glyph: 'M12 3v11M7 10.5a5 5 0 0 0 10 0', glyphFg: accent },
        { state: 'done', vi: 'đã xong', labelFg: '#0A5F67', captionFg: '#58636F',
          segs: [{ bg: '#E1EFF1', bd: '#E1EFF1' }, { bg: '#E1EFF1', bd: '#E1EFF1' }, { bg: '#E1EFF1', bd: '#E1EFF1' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }],
          caption: '3 chủ đề đã phát hiện · 11 tin đã gửi', glyph: 'M20 6.5L9.5 17 4 11.5', glyphFg: '#0A5F67' },
        { state: 'warn', vi: 'suy giảm, vẫn chạy', labelFg: '#6E4A00', captionFg: '#6E4A00',
          segs: [{ bg: '#FFF3DB', bd: '#F0D9A8' }, { bg: '#FFF3DB', bd: '#F0D9A8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }],
          caption: 'Không dùng được micro — chỉ nghe âm thanh từ người khác', glyph: 'M12 3.8L21.2 20H2.8zM12 9.5v4.5M12 17h.01', glyphFg: '#6E4A00' },
        { state: 'error', vi: 'chặn dòng', labelFg: '#FFFFFF', captionFg: '#A62B22',
          segs: [{ bg: accent, bd: accent }, { bg: accent, bd: accent }, { bg: '#A62B22', bd: '#A62B22' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }, { bg: '#FFFFFF', bd: '#DCE2E8' }],
          caption: 'Blaze STT: Insufficient credits — 0 tin vào chat', glyph: 'M9.5 9.5l5 5M14.5 9.5l-5 5', glyphFg: '#A62B22' }
      ]
    };
  }
}
</script>
</body>
</html>
